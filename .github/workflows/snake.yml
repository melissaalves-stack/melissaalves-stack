name: Gerar cobrinha dos commits

on:
  schedule:
    - cron: "0 */12 * * *"   # roda a cada 12 horas
  workflow_dispatch:          # permite rodar na mão pelo botão "Run workflow"
  push:
    branches:
      - main

jobs:
  gerar-cobrinha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: melissaalves-stack
          outputs: |
            dist/github-snake.svg?color_snake=ff2e88&color_dots=0d0d0d,4a0e2a,99194f,d61f6e,ff2e88
            dist/github-snake-dark.svg?palette=github-dark&color_snake=ff2e88

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}