name: Gerar cobrinha dos commits

on:
  schedule:
    - cron: "0 */12 * * *"   # roda a cada 12 horas
  workflow_dispatch:          # botão "Run workflow" (rodar na mão)
  push:
    branches:
      - main

jobs:
  gerar-cobrinha:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Gerar SVG da cobrinha (toda rosa)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: melissaalves-stack
          outputs: |
            dist/github-snake.svg?color_snake=ff2e88&color_dots=#2a0a1a,#7a1540,#c0176a,#ff2e88,#ff9ec4

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
